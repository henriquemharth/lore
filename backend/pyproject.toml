[project]
name = "lore-mcp"
version = "0.1.0"
description = "A local, traceable project memory for AI coding agents (MCP server + web UI)"
license = "MIT"
requires-python = ">=3.12"
keywords = ["mcp", "ai-agents", "knowledge-base", "markdown", "adr", "sqlite", "fts5"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "markdown-it-py>=3.0",
    "mcp>=2.2,<3",
]

[project.scripts]
lore = "lore.cli:main"
lore-mcp = "lore.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lore"]
